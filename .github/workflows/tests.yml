name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Regression tests (no network, no personal files)
        run: python test_regression.py

      - name: Fresh-clone setup smoke test
        # Non-interactive init without venv / downloads, then the health check must not FAIL.
        run: |
          python init.py --yes --no-venv --no-install --no-browser --preset backend
          python doctor.py --json

      - name: Search CLI starts
        run: |
          python search_jobs.py --list-presets
          python search_jobs.py --help
