# Job-Hunter configuration
# -----------------------------------------------------------------------------------------------
# Copy this file to `config.yml` and edit it. `config.yml` is git-ignored and only needs the keys
# you change: everything you leave out falls back to the values below.
# Facts about you (experience, skills, salary, contacts) do NOT go here; they live in
# `Linkedin Agent/candidate-profile.md`. This file says WHAT to search for and WHERE you can work.
#
# The values below are a worked example: a senior QA Automation engineer living in Georgia who
# wants remote work in Europe or relocation. Replace them with your own.

candidate:
  reply_language: en            # language the agents use when talking to you: en, ka, de, uk, ...
  timezone: "GMT+4"             # shown in interview-scheduling messages
  timezone_window: [0, 4]       # UTC offsets you can work with; "GMT+2" / "UTC+3" in a posting count as OK
  cv_file_name: "Firstname_Lastname_CV.pdf"   # file name recruiters see on the CVs you upload

role:
  default_query: "QA Automation Engineer"     # search_jobs.py --query default
  # Roles you target. Used to score titles and as a fallback when the profile has no "Target roles".
  target_roles: [sdet, qa automation, automation engineer, test automation, software development engineer in test]
  # Company-board scan: a job title must contain one of these words ...
  title_keywords: [qa, quality, sdet, test, tester, testing, qe]
  # ... and none of these phrases.
  title_exclude: [data quality, search quality, product quality, sox, compliance, machine learning,
                  product manager, clinical, laboratory, penetration, pen test]
  seniority_bonus: {senior: 15, sr: 15, lead: 15, staff: 15, principal: 15}
  title_penalties: {intern: -40, internship: -40, junior: -25, entry level: -20, manual tester: -25,
                    manual testing only: -40, no automation: -40}
  # Skill weights used only when candidate-profile.md has no "Skills" section.
  fallback_skills: {playwright: 18, selenium: 10, cypress: 10, appium: 8, restassured: 8, typescript: 12,
                    javascript: 10, python: 12, "c#": 12, ".net": 10, sdet: 20, qa automation: 18,
                    automation engineer: 18, test automation: 16, k6: 12, jmeter: 8, api testing: 10,
                    postman: 8, ci/cd: 10, github actions: 8, gitlab: 8, docker: 8, jenkins: 6}

location:
  home_country: Georgia
  # Words that mean "in my country". On-site / hybrid jobs here are fine.
  home_places: [georgia, tbilisi, batumi, kutaisi, საქართველო, თბილისი]
  # Phrases that look like a home place but are not (e.g. the US state of Georgia).
  home_exclude: ["georgia, usa", "georgia, us", "atlanta"]
  open_to_relocation: true      # on-site abroad is still blocked unless the posting offers relocation
  # Remote scopes you can work under.
  friendly_regions: [worldwide, anywhere, global, globally, emea, europe, european time zones, caucasus, cet, eet]
  # Remote jobs limited to these places are out of reach (you cannot live or work there).
  locked_regions: [us, usa, u.s., u.s.a., united states, canada, north america, latam, latin america,
                   brazil, mexico, india, apac, australia, new zealand, philippines, japan, singapore,
                   hong kong, china, taiwan, korea]
  # Places where a right-to-work question is likely but contracts may still work: flag, don't block.
  check_regions: [uk, united kingdom, england, london, germany, netherlands, france, spain, poland,
                  ireland, portugal, eu, european union]

search:
  sources: [ats, indeed, linkedin, google, glassdoor, zip_recruiter, jobs_ge]
  indeed_country: USA
  min_score: 45
  remote_only: true

scoring:
  stale_days: 30                # postings older than this lose 0.3
  repost_gap_days: 7            # same company + title under a new URL after this many days = repost
  verdicts: {apply: 4.0, consider: 3.5, research: 2.5}
